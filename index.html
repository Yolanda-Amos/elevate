<!doctype html>
<html lang="en" data-theme="light" data-accent="violet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Elevate — Calm, intelligent productivity</title>
  <meta name="description" content="Elevate is a premium productivity workspace for tasks, projects, goals, habits, time blocking and deep focus." />
  <meta name="theme-color" content="#FBFBFC" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <!-- Boot / loading state: replaced by the app once state hydration completes -->
  <div class="boot" id="boot">
    <div class="boot__mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="34" height="34"><path d="M6 24 16 5l10 19-10-5.6L6 24Z" fill="currentColor"/></svg>
    </div>
    <p class="boot__label">Elevate</p>
    <div class="boot__bar"><span></span></div>
    <p class="boot__hint">Preparing your workspace…</p>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Primary"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottomnav" id="bottomnav" aria-label="Mobile navigation" hidden></nav>
  <button class="fab" id="fab" type="button" aria-label="Quick add task" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div id="overlays"></div>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <div id="a11y-live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
